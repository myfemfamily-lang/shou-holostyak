<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шоу Холостяк 🌹</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a12;--card:#1f1220;--rose:#e0245e;--gold:#f5c26b;--text:#f6eef3;--muted:#b9a3b1;--ok:#3ccf8e;--bad:#ff5c7a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#3a1030 0,var(--bg) 60%);color:var(--text);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:"Playfair Display",serif;margin:.2em 0}
h1{font-size:40px;line-height:1.05;text-align:center}
h1 span{color:var(--rose)}
h2{font-size:26px}
.sub{color:var(--muted);text-align:center;margin-bottom:18px}
.card{background:var(--card);border:1px solid #3a2236;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0006}
.badge{display:inline-block;background:#3a1030;color:var(--gold);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.host{display:flex;gap:10px;align-items:flex-start;background:#2a1528;border-radius:14px;padding:12px;margin:12px 0;font-size:15px}
.host .av{font-size:28px;flex:none}
.host b{color:var(--gold)}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;padding:14px 16px;width:100%;font-weight:700;font-size:16px;transition:transform .1s}
button:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--rose),#ff6b8b);color:#fff;margin-top:10px}
.opt{background:#2c1a2b;color:var(--text);text-align:left;margin:8px 0;font-weight:600;border:1px solid #452a42}
.opt.picked{border-color:var(--gold);background:#3b2235}
.opt:disabled{cursor:default}
input,textarea{width:100%;font:inherit;background:#2c1a2b;color:var(--text);border:1px solid #452a42;border-radius:12px;padding:12px;margin-top:8px}
textarea{min-height:140px;resize:vertical}
.roses{position:sticky;top:0;z-index:5;background:#120a12e6;backdrop-filter:blur(6px);text-align:center;padding:8px;font-weight:700;border-bottom:1px solid #3a2236}
.progress{height:6px;background:#2c1a2b;border-radius:9px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--rose);transition:width .3s}
.tf{display:flex;gap:8px}
.tf button{flex:1}
.true{background:#163a2b;color:#bff3da}
.false{background:#3a1622;color:#ffc7d3}
.lb-row{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #3a2236}
.lb-row.me{color:var(--gold);font-weight:700}
.big{font-size:64px;text-align:center;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;padding:5px 10px;border-radius:99px;background:#2c1a2b;border:1px solid #452a42}
.chip.on{background:#163a2b;border-color:var(--ok)}
.hidden{display:none}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
a.final{display:block;text-align:center;text-decoration:none}
.lb-row.first{background:linear-gradient(90deg,#f5c26b33,#e0245e22);border:1px solid var(--gold);border-radius:12px;padding:12px 10px;font-weight:800;color:var(--gold);box-shadow:0 0 18px #f5c26b44;margin-bottom:4px}
.winner-name{font-family:"Playfair Display",serif;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 20px #f5c26b88;margin:4px 0 8px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.hidden{display:none}
/* ---- визуальная новелла ---- */
.scene{position:fixed;inset:0;background:#120a12 url(mike.jpg) top center/100% auto no-repeat;z-index:0;animation:zoom 14s ease-out forwards;transform-origin:top center}
.scene::after{content:"";position:absolute;left:0;right:0;top:calc(133.9vw - 220px);bottom:0;background:linear-gradient(#120a1200,#120a12 220px)}
@keyframes zoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.hud{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;max-width:480px;margin:0 auto}
.pill{background:linear-gradient(#4a1d3c,#2b1024);border:2px solid var(--gold);border-radius:99px;padding:6px 14px 6px 10px;font-size:17px;color:#fff;box-shadow:0 3px 10px #0008}
.stage-pill{background:#000a;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.03em}
.vn-ui{position:fixed;left:0;right:0;bottom:0;z-index:3;max-width:480px;margin:0 auto;padding:0 12px calc(18px + env(safe-area-inset-bottom))}
.bubble{position:relative;background:#fffaf7;color:#2a1420;border:3px solid #e8b6c8;border-radius:22px;padding:26px 18px 16px;font-size:18px;line-height:1.35;box-shadow:0 8px 24px #000a;animation:pop .25s ease-out;margin-top:22px}
.bubble::after{content:"";position:absolute;top:-20px;right:56px;border:12px solid transparent;border-bottom:20px solid #fffaf7;border-top:0;filter:drop-shadow(0 -3px 0 #e8b6c8)}
.tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:linear-gradient(#ff6b8b,var(--rose));color:#fff;font-weight:700;font-size:15px;padding:5px 22px;border-radius:12px;border:2px solid #fff;white-space:nowrap;box-shadow:0 3px 8px #0006}
.tag.host-tag{background:linear-gradient(#f7d58f,#d9a441);color:#3a2208}
.say .you{font-size:14px;color:#9a6a80;font-style:italic;margin-bottom:6px}
.choices{margin-top:10px}
.choice{display:block;width:100%;text-align:left;background:linear-gradient(#5b2a4f,#3d1835);color:#fff;border:2px solid #f5c26b99;border-radius:18px;padding:13px 16px;margin:9px 0;font-size:16px;font-weight:600;box-shadow:0 4px 12px #0009;animation:pop .3s ease-out both}
.choice:nth-child(2){animation-delay:.07s}.choice:nth-child(3){animation-delay:.14s}
.choice.next{text-align:center;background:linear-gradient(135deg,var(--rose),#ff6b8b);border-color:#fff8}
.choice.true{background:linear-gradient(#1f6b4b,#14432f);text-align:center}
.choice.false{background:linear-gradient(#8a2440,#5a1428);text-align:center}
.tf{display:flex;gap:10px}.tf .choice{flex:1}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
body::before{content:"";position:fixed;inset:-20px;background:url(mike.jpg) center 15%/cover;filter:blur(18px) brightness(.35);z-index:-1}
.hero{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;mask-image:linear-gradient(#000 75%,transparent);-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.win-photo{width:140px;height:140px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:3px solid var(--rose);box-shadow:0 0 30px #e0245e88;margin:8px auto;display:block}
</style>
</head>
<body>
<div class="roses hidden" id="bar">🌹 <span id="rc">0</span> роз · <span id="stage"></span><div class="progress"><i id="pg" style="width:0"></i></div></div>
<div class="wrap" id="app"></div>

<script>
/* ====== НАСТРОЙКИ — меняйте здесь ====== */
const CONFIG = {
  name: "Майк",
  host: "Правая рука Майка",
  hostIcon: "🤚",
  // Общая турнирная таблица (Supabase). Пусто = таблица только в браузере участницы.
  supabaseUrl: "https://gnpdisuhxryhbuihsypz.supabase.co",   // например "https://abcdxyz.supabase.co"
  supabaseKey: "sb_publishable_UNbFLbMoicNsxW-hMoeAfg_BDh9tWIR"    // публичный ключ "anon public" из Supabase → Project Settings → API
};

/* ====== Общая таблица лидеров ====== */
function dbHeaders(){ const h = {apikey:CONFIG.supabaseKey, "Content-Type":"application/json"}; if(CONFIG.supabaseKey.startsWith("eyJ")) h.Authorization = "Bearer "+CONFIG.supabaseKey; return h; }
async function submitScore(name, roses){
  const r = await fetch(CONFIG.supabaseUrl+"/rest/v1/scores",{method:"POST",headers:{...dbHeaders(),Prefer:"return=minimal"},body:JSON.stringify({name,roses})});
  if(!r.ok) throw new Error("insert "+r.status);
}
async function fetchTop(){
  const r = await fetch(CONFIG.supabaseUrl+"/rest/v1/scores?select=name,roses&order=roses.desc,created_at.asc&limit=200",{headers:dbHeaders()});
  if(!r.ok) throw new Error("select "+r.status);
  return r.json();
}

/* ====== Серия 1: свидания ====== */
const QUIZ = [
  {q:"Первое свидание. Майк садится возле тебя, берёт твою руку, нежно целует её и задаёт первый вопрос: «Ты знаешь, кто я?»",
   o:[["«Да, ты мой будущий Господин»",1],["«Да, ты лучший AI-эксперт в сфере»",2],["«Не ебу»",0]]},
  {q:"Ваше второе свидание проходит в замке Монфор, в Верхней Галилее на севере Израиля. Он снимает с твоих глаз повязку, чтобы ты могла увидеть эту красоту. Целует в лоб и говорит: <bdi dir=\"rtl\" lang=\"he\">«את אוהבת את הנוף?»</bdi>",
   o:[["<bdi dir=\"rtl\" lang=\"he\">כן, אני אוהבת את זה</bdi>",2],["«Ебанулся?»",0],["«Щас принесу таблетки»",1]]},
  {q:"Ваше третье свидание проходит на подкасте, куда Майка позвали как AI-специалиста. Тебе нужно поддержать его. Что ты ему скажешь?",
   o:[["«Ты самый лучший AI-эксперт в сфере»",2],["«Ты мой учитель»",1],["«Сколько ты заплатил, чтобы тебя пригласили хоть куда-нибудь?»",0]]},
  {q:"Майк решил поделиться с тобой своей страницей в LinkedIn.",
   o:[["«Ого, у тебя целых 26 000 подписчиков!»",2],["«Сколько стоила накрутка?»",0],["«А почему прочтений постов всего 20?»",1]]}
];

/* ====== Серия 3: правда или ложь ====== [утверждение, правда?, пояснение] */
const FACTS = [
  ["У Майка больше 15 лет опыта в маркетинге — он CMO и специалист по продуктовому маркетингу.",true,""],
  ["Майк ведёт рубрику «Как быть гениальным во всём с помощью AI».",false,""],
  ["Майк однажды написал промт на 47 страниц.",false,""],
  ["Майк делегировал AI 42% своих задач.",false,"Ведь правильный ответ — всего 40%."],
  ["У Майка в LinkedIn больше 25 тысяч подписчиков.",true,""],
  ["В LinkedIn у Майка больше 25 тысяч человек.",true,""],
  ["У Майка есть LinkedIn.",true,""],
  ["У Майка 30 тысяч подписчиков в LinkedIn.",false,"Всего 25 тысяч."]
];

const TOTAL = QUIZ.length*2 + 10 + FACTS.length;

const app = document.getElementById("app");
let S = {player:"", roses:0, step:0};
const tg = window.Telegram && window.Telegram.WebApp;
try{ tg && tg.ready(); tg && tg.expand(); }catch(e){}

function tgName(){ try{ const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; return u ? (u.first_name||"") : ""; }catch(e){ return ""; } }
function haptic(){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); }catch(e){} }
function setBar(stage,p){ document.getElementById("bar").classList.remove("hidden"); document.getElementById("rc").textContent=S.roses; document.getElementById("stage").textContent=stage; document.getElementById("pg").style.width=p+"%"; }
function host(t){ return `<div class="host"><div class="av">${CONFIG.hostIcon}</div><div><b>${CONFIG.host}:</b> ${t}</div></div>`; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- Старт ---------- */
function intro(){
  app.innerHTML = `
  <h1 style="margin-top:14px">Шоу <span>Холостяк</span> 🌹</h1>
  <div class="sub">Сможешь ли ты добиться Майка и получить заветную розу?</div>
  <div class="card" style="padding:0;overflow:hidden">
    <img class="hero" src="mike.jpg" alt="Холостяк ${CONFIG.name} с розой">
    <div style="padding:18px">
    <h2>Холостяк: ${CONFIG.name}</h2>
    <p>CMO. 15+ лет в маркетинге. 26 000 подписчиков в LinkedIn — и ни одного лайка <i>по любви</i>.</p>
    <p>Говорит с нейросетями чаще, чем с людьми. Ищет ту, чей промт он захочет перечитать.</p>
    ${host("Я — правая рука Майка, и я всё вижу. Впереди свидания, промт-баттл и «Правда или ложь». А в конце — церемония роз.")}
    <input id="nm" placeholder="Как вас представить участницам?" maxlength="30" value="${esc(tgName())}">
    <button class="primary" onclick="start()">Войти в шоу 🌹</button>
    </div>
  </div>`;
}
function start(){
  const v = document.getElementById("nm").value.trim();
  if(!v){ document.getElementById("nm").focus(); return; }
  S.player = v; S.roses = 0; S.step = 0; quiz();
}

/* ---------- Серия 1 ---------- */
function vn(img, stage, tag, text, choices, tagClass){
  document.getElementById("bar").classList.add("hidden");
  return `<div class="scene" style="background-image:url(${img})"></div>
  <div class="hud"><div class="pill">🌹 <b>${S.roses}</b></div><div class="stage-pill">${stage}</div></div>
  <div class="vn-ui">
    <div class="bubble"><div class="tag ${tagClass||""}">${tag}</div><div class="say">${text}</div></div>
    <div class="choices">${choices}</div>
  </div>`;
}
function quiz(){
  const i = S.step, q = QUIZ[i];
  app.innerHTML = vn(`date${i+1}.jpg`, `Серия 1 · ${i+1}/${QUIZ.length}`, `Свидание ${i+1}`, q.q,
    q.o.map((o,k)=>`<button class="choice" onclick="pick(${k})">${o[0]}</button>`).join(""));
}
const QUIZ_FB = [["Холостяк заметно покраснел. +2 🌹","Неплохо, но он ждал большего. +1 🌹","Холостяк молча открыл ChatGPT и спросил «что я сделал не так». 0 🌹"]];
function pick(k){
  haptic();
  const o = QUIZ[S.step].o[k], pts = o[1];
  S.roses += pts;
  const msg = pts===2?QUIZ_FB[0][0]:pts===1?QUIZ_FB[0][1]:QUIZ_FB[0][2];
  app.innerHTML = vn(`date${S.step+1}.jpg`, `Серия 1 · ${S.step+1}/${QUIZ.length}`, CONFIG.hostIcon+" "+CONFIG.host,
    `<div class="you">Ты: ${o[0]}</div>${msg}`,
    `<button class="choice next" onclick="nextQ()">Дальше ▸</button>`, "host-tag");
}
function nextQ(){ S.step++; S.step<QUIZ.length ? quiz() : battleIntro(); }

/* ---------- Серия 2: промт-баттл ---------- */
function battleIntro(){
  setBar("Серия 2: Промт-баттл", 33);
  app.innerHTML = `<div class="card" style="padding:0;overflow:hidden"><img class="hero" src="battle.jpg" alt="" style="aspect-ratio:4/3;object-position:60% 48%"><div style="padding:0 18px 18px"><div class="badge">Серия 2 · Промт-баттл</div>
  <h2>Напиши промт, который заставит Майка влюбиться</h2>
  ${host("Холостяк — профессионал. Он оценит роль, контекст, тон, формат и ограничения. Бонус за креатив. Я буду судить строго, но честно. Почти.")}
  <textarea id="pr" placeholder="Например: Ты — ведущий маркетолог мира любви. Контекст: ..."></textarea>
  <div class="chips" id="chips"></div>
  <button class="primary" onclick="judge()">Отправить на суд 🤖</button></div></div>`;
  const pr = document.getElementById("pr");
  pr.addEventListener("input",()=>renderChips(analyze(pr.value)));
  renderChips(analyze(""));
}
const CRIT = [
  ["Роль", /(ты\s*[—–-]|ты\s+—|представь|выступи|act as|you are|в роли|будь\s)/i, "Где роль? Без роли модель не знает, кто она. Как свидание без имени."],
  ["Контекст", /(майк|mike|холост|он\s|его\s|cmo|маркет|linkedin|контекст)/i, "Ни слова о холостяке. Промт, который не про него, — это спам."],
  ["Тон", /(тон|стил|весел|роман|нежн|смешн|игрив|ирони|дерз|tone)/i, "Тон не задан. Модель выберет «корпоративный». Не надо так."],
  ["Формат", /(формат|список|пункт|буллет|строк|слов|абзац|стих|письм|json|таблиц)/i, "Формат не указан. Он CMO — ему нужна структура!"],
  ["Ограничения", /(не\s+(использ|пиши|упомин|больше|длинн)|максимум|не более|до\s+\d+|без\s|only|never|избег)/i, "Нет ограничений. Без них модель напишет поэму на 9 страниц."]
];
function analyze(t){
  const hits = CRIT.map(c=>c[1].test(t));
  const len = t.trim().length;
  const emoji = /\p{Extended_Pictographic}/u.test(t);
  return {hits,len,emoji};
}
function renderChips(a){
  document.getElementById("chips").innerHTML = CRIT.map((c,i)=>`<span class="chip ${a.hits[i]?"on":""}">${a.hits[i]?"✓":"○"} ${c[0]}</span>`).join("")
   + `<span class="chip ${a.emoji?"on":""}">${a.emoji?"✓":"○"} Эмодзи-бонус</span>`;
}
function judge(){
  const t = document.getElementById("pr").value;
  const a = analyze(t);
  if(a.len<1){ document.getElementById("pr").focus(); return; }
  haptic();
  let pts = a.hits.filter(Boolean).length*1.6;
  if(a.emoji) pts+=1;
  if(a.len>120) pts+=1;
  if(a.len>1500) pts-=2;
  pts = Math.max(0,Math.min(10,Math.round(pts)));
  S.roses += pts;
  const misses = CRIT.filter((c,i)=>!a.hits[i]).map(c=>"• "+c[2]);
  let verdict = pts>=9 ? "Это не промт, это предложение руки и сердца. Холостяк сохранил его в избранное и поставил в закреп."
    : pts>=6 ? "Хороший промт. Холостяк перечитал его дважды и сделал скриншот. Но есть что докрутить:"
    : pts>=3 ? "Модель ответила «Чем могу помочь?». Холостяк вздохнул. Вот что пошло не так:"
    : "Это… это вы написали «привет»? Холостяк ушёл переписывать свой системный промт.";
  if(a.len>1500) verdict += " И да — это слишком длинно. Контекстное окно у холостяка не резиновое.";
  setBar("Серия 2: Промт-баттл", 55);
  app.innerHTML = `<div class="card"><div class="badge">Вердикт</div>
  <div class="big">${"🌹".repeat(Math.min(pts,5))||"🥀"}</div>
  <h2 style="text-align:center">+${pts} роз из 10</h2>
  ${host(verdict + (misses.length && pts<9 ? "<br><br>"+misses.join("<br>") : ""))}
  <div class="card" style="background:#160c16;font-size:14px;white-space:pre-wrap">${esc(t)}</div>
  <button class="primary" onclick="S.step=0;facts()">К следующему испытанию</button></div>`;
}

/* ---------- Серия 3: правда или галлюцинация ---------- */
function facts(){
  const i = S.step, f = FACTS[i];
  app.innerHTML = vn("facts.jpg", `Серия 3 · ${i+1}/${FACTS.length}`, i===0 ? CONFIG.hostIcon+" "+CONFIG.host : "Правда или ложь?",
    (i===0 ? `<div class="you">Посмотрим, насколько хорошо ты знаешь холостяка.</div>` : "") + `«${f[0]}»`,
    `<div class="tf"><button class="choice true" onclick="ans(true)">✅ Правда</button><button class="choice false" onclick="ans(false)">❌ Ложь</button></div>`,
    i===0 ? "host-tag" : "");
}
function ans(v){
  haptic();
  const f = FACTS[S.step], ok = v===f[1];
  if(ok) S.roses++;
  const real = (f[1] ? "Это правда." : "Это ложь.") + (f[2] ? " " + f[2] : "");
  app.innerHTML = vn("facts.jpg", `Серия 3 · ${S.step+1}/${FACTS.length}`, CONFIG.hostIcon+" "+CONFIG.host,
    (ok?"Верно! +1 🌹 ":"Мимо. ") + real,
    `<button class="choice next" onclick="nextF()">Дальше ▸</button>`, "host-tag");
}
function nextF(){ S.step++; S.step<FACTS.length ? facts() : ceremony(); }

/* ---------- Церемония роз ---------- */
function title(r){
  const p = r/TOTAL;
  return p>=.85?"👑 Prompt Queen":p>=.7?"💎 Fine-tuned Girlfriend":p>=.5?"✨ Zero-shot Romantic":p>=.3?"🧪 Бета-тестировщица":"🥀 Ошибка 404: чувства не найдены";
}
function loadLB(){ try{ return JSON.parse(localStorage.getItem("pb_lb")||"[]"); }catch(e){ return []; } }
function saveLB(l){ try{ localStorage.setItem("pb_lb",JSON.stringify(l)); }catch(e){} }
function ceremony(){
  setBar("Церемония роз", 100);
  app.innerHTML = `<div class="card" style="text-align:center"><div class="badge">Церемония роз</div>
  <h2>Холостяк берёт последнюю розу…</h2><div class="big" id="drum">🌹</div>
  ${host("Напряжение. Тишина. Где-то вдалеке GPU греется от волнения…")}</div>`;
  setTimeout(final, 2200);
}
async function final(){
  const mine = {n:S.player, r:S.roses, me:true};
  let all = null;
  if(CONFIG.supabaseUrl && CONFIG.supabaseKey){
    try{
      await submitScore(S.player, S.roses);
      all = (await fetchTop()).map(x=>({n:x.name, r:x.roses}));
      const i = all.findIndex(x=>x.n===S.player && x.r===S.roses);
      if(i>=0) all[i] = mine; else all.push(mine);
    }catch(e){ all = null; }
  }
  if(!all){
    const saved = loadLB(); saved.push({n:S.player,r:S.roses}); saveLB(saved.slice(-30));
    all = [mine].concat(saved.slice(0,-1));
  }
  all.sort((a,b)=>b.r-a.r);
  const place = all.indexOf(mine)+1;
  const top = all[0];
  const iWon = top===mine;
  const row = (x,i)=>`<div class="lb-row ${i===0?"first":""} ${x.me?"me":""}"><span>${i===0?"👑":i+1+"."} ${esc(x.n)}${x.me?" (вы)":""}</span><span>${x.r} 🌹</span></div>`;
  app.innerHTML = `<div class="card" style="text-align:center">
    <div class="badge">Церемония роз</div>
    <img class="win-photo" src="mike.jpg" alt="${CONFIG.name}">
    <h2>И роза достаётся…</h2>
    <div class="winner-name">${esc(top.n)} 🌹</div>
    ${host(iWon ? `${esc(S.player)}, ты принимаешь эту розу? Холостяк ждёт ответа.` : `${esc(S.player)}, сегодня не твой вечер. Но правая рука Майка разрешает попробовать ещё раз.`)}
    <div style="margin-top:6px">Ваш результат: <b>${S.roses} из ${TOTAL} 🌹</b> · ${place}-е место</div>
    <div style="font-size:18px;font-weight:700;color:var(--gold);margin-top:4px">${title(S.roses)}</div>
    <button class="primary" onclick="writeBachelor()">💌 Написать Холостяку</button>
    <button class="opt" style="text-align:center" onclick="intro()">🔁 Пройти ещё раз</button>
  </div>
  <div class="card"><h2>🏆 Турнирная таблица</h2>
   ${all.slice(0,10).map(row).join("")}
   ${place>10?row(mine,place-1):""}
  </div>
  <div class="modal hidden" id="modal" onclick="this.classList.add('hidden')">
    <div class="card" style="text-align:center;max-width:360px" onclick="event.stopPropagation()">
      <div class="big">📨</div>
      <p style="font-size:17px">Мы передали ваш запрос AI-ассистенту Холостяка. С вами свяжется AI-автоответчик.</p>
      <button class="primary" onclick="document.getElementById('modal').classList.add('hidden')">Жду с нетерпением</button>
    </div>
  </div>`;
}
function writeBachelor(){ haptic(); document.getElementById("modal").classList.remove("hidden"); }
intro();
</script>
</body>
</html>
